<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAPSOA - Voyagez dans le temps</title>
    <meta name="description" content="CAPSOA, l'application française de capsule temporelle numérique. Aujourd'hui ne s'oubliera jamais.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 850px;
            flex: 1;
        }

        .logo {
            width: 100%;
            height: auto;
            display: block;
            margin: 35px auto 0;
        }

        .content {
            padding: 15px 20px 40px;
        }

        h1 {
            font-size: clamp(18px, 3vw, 25px);
            font-weight: 400;
            line-height: 1.5;
            margin: 20px 0;
        }

        .slogan {
            font-size: 17px;
            color: #cccccc;
            margin-bottom: 35px;
        }

        .stores {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .store {
            background: #171717;
            border: 1px solid #555;
            border-radius: 12px;
            padding: 16px 25px;
            min-width: 190px;
            font-size: 17px;
        }

        .soon {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #c77cff;
        }

        footer {
            padding: 25px 15px;
            font-size: 13px;
            color: #aaaaaa;
        }

        footer a {
            color: #dddddd;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .logo {
                margin-top: 25px;
            }

            .content {
                padding-top: 5px;
            }

            .stores {
                gap: 12px;
            }

            .store {
                min-width: 145px;
                padding: 14px 12px;
                font-size: 15px;
            }

            .slogan {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main>

        <img
            class="logo"
            src="FOND%20CAPSOA.png"
            alt="CAPSOA - Voyagez dans le temps"
        >

        <div class="content">

            <h1>
                L'application française de<br>
                capsule temporelle numérique
            </h1>

            <p class="slogan">
                Aujourd'hui ne s'oubliera jamais.
            </p>

            <div class="stores">

                <div class="store">
                    🍎 App Store
                    <span class="soon">Bientôt disponible</span>
                </div>

                <div class="store">
                    ▶ Google Play
                    <span class="soon">Bientôt disponible</span>
                </div>

            </div>

        </div>

    </main>

    <footer>
        Contact :
        <a href="mailto:contact@capsoa.fr">
            contact@capsoa.fr
        </a>
        <br><br>
        © 2026 CAPSOA
    </footer>

</body>
</html>
